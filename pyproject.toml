[project]
name = "djangotestproject"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.4",
    "django-completion>=0.1.0",
    "django-environ>=0.13.0",
    "django-rest-framework>=0.1.0",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"
indent-width = 4

lint.exclude = [
    'venv', '.git',
    '.idea', '__pycache__',
    '**/migrations/**', 'scripts/',
    '**/tests/**'
]
lint.select = [
    "I", # isort
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "C", # complexity
    "N", # pep8-naming
    "RUF", # ruff
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT", # flake-pytest-style
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"init.py" = ["F401"]  # unused imports in init.py
"**/migrations/*.py" = ["ALL"]  # ignore all rules in migrations

